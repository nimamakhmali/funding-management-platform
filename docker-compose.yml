services:
  # ─── Database ──────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: investment_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ─── Backend (Django) ──────────────────────
  backend:
    build:
      context: ./investment_platform_BackEnd
      dockerfile: Dockerfile
    container_name: investment_backend
    restart: unless-stopped

    env_file:
      - ./investment_platform_BackEnd/.env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ALLOWED_HOSTS: ${SERVER_IP},localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://${SERVER_IP}
      CSRF_TRUSTED_ORIGINS: http://${SERVER_IP}
      FRONTEND_BASE_URL: http://${SERVER_IP}
      BACKEND_PUBLIC_BASE_URL: http://${SERVER_IP}

    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(3); s.connect(('localhost', 8000)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - app_network

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
  # ─── Frontend (Next.js + pnpm) ─────────────
  frontend:
    build:
      context: ./investment_platform_FrontEnd/investment_managment_project
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${SERVER_IP}
        NEXT_PUBLIC_API_URL: http://${SERVER_IP}
    container_name: investment_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # ─── Nginx (Reverse Proxy) ─────────────────
  nginx:
    image: nginx:alpine
    container_name: investment_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  app_network:
    driver: bridge