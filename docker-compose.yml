version: "3.9"

services:
  # ─── Database ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-investment_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ─── Backend (Django) ───────────────────────────────────
  backend:
    build:
      context: ./investment_platform_BackEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./investment_platform_BackEnd/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app_network
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --timeout 120
             --access-logfile -
             --error-logfile -"

  # ─── Frontend (Next.js) ─────────────────────────────────
  frontend:
    build:
      context: ./investment_platform_FrontEnd/investment_managment_project
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # این آدرس داخلی داکر است - فرانت‌اند سمت سرور از آن استفاده می‌کند
      NEXT_PUBLIC_API_BASE_URL: http://${SERVER_IP:-5.198.179.184}
      NEXT_PUBLIC_API_URL: http://${SERVER_IP:-5.198.179.184}
    depends_on:
      - backend
    networks:
      - app_network

  # ─── Nginx (Reverse Proxy) ──────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  app_network:
    driver: bridge